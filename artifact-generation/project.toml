[project]
name = "artifact-generation"
version = "0.1.0"
description = "Stable Diffusion and procedural based pipeline for generating synthetic histopathology artifacts."
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.21.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "tqdm>=4.65.0",
    "pyarrow>=12.0.0",
    "opencv-python>=4.7.0"
]