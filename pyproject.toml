[project]
name = "luad-stress-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zuzanna Krawczyk-Borysiak", email = "zuzanna.krawczyk-borysiak@ideas.edu.pl" },
    { name = "Adam Krawczyk", email = "adam.krawczyk@akces-ncbr.pl" },
    { name = "Magłorzata Sokół", email = "maglorzata.sokol@ideas.edu.pl" },
    { name = "Zaneta Swiderska-Chadaj", email = "zaneta.swiderska-chadaj@ideas.edu.pl" },
]
requires-python = ">=3.12"
dependencies = [
    "jsonargparse>=4.48.0",
    "loguru>=0.7.3",
    "opencv-python>=4.13.0.92",
    "openslide-bin>=4.0.0.13",
    "openslide-python>=1.4.3",
    "pandas>=3.0.2",
    "pandas-stubs>=3.0.0.260204",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.4",
]

[project.optional-dependencies]
cpu = [
    "lightning[pytorch-extra]==2.4.0",
    "torch==2.6.0+cpu",
    "torchvision==0.21.0+cpu",
    "timm==1.0.13",
    "transformers==4.52.4",
]
cuda = [
    "lightning[pytorch-extra]==2.4.0",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "cuda-toolkit>=12.4.0",
    "timm==1.0.13",
    "transformers==4.52.4",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
luad-stress-test = "luad_stress_test:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
